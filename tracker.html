<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <title>Product Tracker - eBay Product Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
        <a href="tracker.html">Product Tracker</a>
    </nav>

<h1>Track a Product</h1>

<img class="tracker-image"
src="images/logo.jpg"
alt="Online shopping products">

    <form>
        <label for="productName">Product Name:</label>
        <input type="text" id="productName" name="productName">

        <br><br>

        <label for="searchTerm">eBay Search Term:</label>
        <input type="text" id="searchTerm" name="searchTerm">   

        <br><br>

        <label for="category">Category:</label>

        <input type="text" id="category" name="category">

        <br><br>

        <label for="targetPrice">Target Price:</label>

        <input type="number" id="targetPrice" name="targetPrice">

        <br><br>

        <input type="submit" value="Track Product">

    </form>

</body>

</html>
